<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1730">
<title>Your Trip — Premium Kosher Tours</title>
<style>
:root{--navy:#0B1730;--navy2:#182A52;--gold:#C8A84B;--gold2:#E2C96B;--bg:#F4F6FB;--text:#172033;--muted:#64748B;--line:#E2E8F0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
header{background:linear-gradient(135deg,#071126,var(--navy2));color:white;padding:calc(16px + env(safe-area-inset-top)) 18px 18px;display:flex;align-items:center;gap:14px}
header img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)}
header h1{margin:0;color:var(--gold2);font-size:17px;letter-spacing:.06em;text-transform:uppercase}
header p{margin:4px 0 0;color:rgba(255,255,255,.75);font-size:12px}
main{padding:16px;max-width:760px;margin:auto}
.panel{background:white;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 8px 26px rgba(15,23,42,.08)}
h2{margin:0 0 10px;color:var(--navy);font-size:20px}
h3{margin:0 0 10px;color:var(--navy);font-size:15px}
.muted{color:var(--muted);line-height:1.5;font-size:13px}
.tour-card{border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:12px;padding:14px;margin:10px 0;background:white}
.tour-card b{color:var(--navy);font-size:16px;display:block}
.tour-date{display:inline-block;margin-top:4px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#A77F25;background:#FBF3DE;padding:3px 9px;border-radius:999px}
.tour-desc{color:var(--muted);font-size:13px;margin-top:8px;line-height:1.5}
.tour-notes{color:var(--muted);font-size:12px;margin-top:6px;font-style:italic}
.tour-price{float:right;font-weight:800;color:var(--navy);font-size:16px}
button,.btn{font-family:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:13px}
.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy);display:inline-block;text-decoration:none;margin-top:10px}
.secondary{background:#EEF2F7;border:1px solid #CBD5E1;color:#334155;display:inline-block;text-decoration:none;margin-top:10px;margin-left:6px}
.totals{background:var(--navy);color:white;border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.totals b{color:var(--gold2);font-size:20px}
.pay-block{background:#F8FAFC;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px;white-space:pre-wrap;font-size:13px;line-height:1.6}
.pay-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#A77F25;margin-bottom:6px}
.rest-card{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.rest-card div b{color:var(--navy);display:block}
.rest-card div small{color:var(--muted)}
.rest-card a{background:var(--navy);color:var(--gold2);text-decoration:none;font-weight:800;font-size:12px;padding:8px 12px;border-radius:8px;white-space:nowrap}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header><img src="logo.jpg"><div><h1>Premium Kosher Tours</h1><p id="clientHeading">Your Trip</p></div></header>
<main id="app">
<div class="empty">Loading your trip...</div>
</main>

<script>
function b64DecodeUnicode(str){return decodeURIComponent(Array.prototype.map.call(atob(str),c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''))}
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return '$'+(Number(n)||0).toFixed(2)}

function parsePayload(){
  const hash=window.location.hash.replace(/^#/,'');
  if(!hash)return null;
  try{return JSON.parse(b64DecodeUnicode(hash))}catch(e){return null}
}

function pad(n){return (n<10?'0':'')+n}
function icsDate(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  if(isNaN(d))return null;
  return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
}
function nextDay(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+1);
  return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
}
function buildIcs(items){
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Premium Kosher Tours//Client//EN','CALSCALE:GREGORIAN'];
  items.forEach((it,i)=>{
    if(!it.date)return;
    const dt=icsDate(it.date);if(!dt)return;
    lines.push('BEGIN:VEVENT');
    lines.push('UID:'+Date.now()+'-'+i+'@premiumkoshertours');
    lines.push('DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z');
    lines.push('DTSTART;VALUE=DATE:'+dt);
    lines.push('DTEND;VALUE=DATE:'+nextDay(it.date));
    lines.push('SUMMARY:'+(it.tourName||'Tour').replace(/[\n,]/g,' '));
    if(it.tourDesc)lines.push('DESCRIPTION:'+it.tourDesc.replace(/[\n]/g,' ').replace(/,/g,'\\,'));
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}
function downloadIcs(filename,content){
  const blob=new Blob([content],{type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url)},100);
}
function addAllToCalendar(){
  const p=window._payload;if(!p)return;
  downloadIcs('my-trip.ics',buildIcs(p.items));
}
function addOneToCalendar(idx){
  const p=window._payload;if(!p)return;
  const it=p.items[idx];
  downloadIcs((it.tourName||'tour').replace(/[^a-z0-9]+/gi,'-')+'.ics',buildIcs([it]));
}

function render(){
  const p=parsePayload();
  const app=document.getElementById('app');
  if(!p||!p.items){
    app.innerHTML='<div class="empty">This link is invalid or has expired. Please ask Premium Kosher Tours for a new link.</div>';
    return;
  }
  window._payload=p;
  document.getElementById('clientHeading').textContent='Trip for '+(p.clientName||'you');

  const toursHtml=p.items.map((it,i)=>`
    <div class="tour-card">
      <span class="tour-price">${money(it.price)}</span>
      <b>${esc(it.tourName)}</b>
      ${it.date?`<span class="tour-date">${esc(it.date)}</span>`:''}
      ${it.tourDesc?`<div class="tour-desc">${esc(it.tourDesc)}</div>`:''}
      ${it.notes?`<div class="tour-notes">${esc(it.notes)}</div>`:''}
      ${it.date?`<div><button class="secondary" style="margin-left:0" onclick="addOneToCalendar(${i})">Add to Calendar</button></div>`:''}
    </div>`).join('');

  const hasDates=p.items.some(it=>it.date);
  const restHtml=(p.restaurants||[]).map(r=>`
    <div class="rest-card">
      <div><b>${esc(r.name)}</b>${r.notes?`<small>${esc(r.notes)}</small>`:''}</div>
      <a href="${esc(r.url)}" target="_blank" rel="noopener">Reserve</a>
    </div>`).join('') || '<p class="muted">No restaurant recommendations added yet.</p>';

  const pay=p.payment||{};
  app.innerHTML=`
    <div class="panel">
      <h2>Your Itinerary</h2>
      <p class="muted">Here are the tours included in your trip. Tap "Add to Calendar" to save any tour to your phone's calendar.</p>
      ${toursHtml}
      <div class="totals"><span>Total</span><b>${money(p.total)}</b></div>
      ${hasDates?'<button class="gold" onclick="addAllToCalendar()">Add All Tours to Calendar</button>':''}
    </div>

    <div class="panel">
      <h2>Payment</h2>
      ${pay.iuniverso?`<div class="pay-title">Pay by Credit Card (Iuniverso)</div><div class="pay-block">${esc(pay.iuniverso)}</div>`:''}
      ${pay.wire?`<div class="pay-title" style="margin-top:14px">Wire Transfer</div><div class="pay-block">${esc(pay.wire)}</div>`:''}
      ${(!pay.iuniverso&&!pay.wire)?'<p class="muted">Payment instructions have not been added yet — please contact Premium Kosher Tours.</p>':''}
    </div>

    <div class="panel">
      <h2>Restaurant Recommendations</h2>
      <p class="muted">Book directly with the restaurant using the links below.</p>
      ${restHtml}
    </div>
  `;
}

render();
window.addEventListener('hashchange',render);
</script>
</body>
</html>
